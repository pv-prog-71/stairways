      { id: 's2', x: 1290, y: 420, len: 420, ang: 90, kind: 'rot', on: false, dir: -1, speed: 26 },
    ],
    levers: [{ x: 950, plat: 'pm', actions: [{ stair: 's2', on: true }] }],
    memory: { id: 'epl_clock', x: 1560, y: 285 },
    exit: null,
    plan: ['L0', 'M'],
  },
];


// ---- engine.js ----
// ============================================================
// STAIRWAYS — core simulation (deterministic, no DOM access)
// ============================================================

const PHYS = {
  G: 2000,            // gravity px/s^2
  MAX_FALL: 1300,
  WALK: 250,          // ground speed
  AIR_ACC: 1900,
  STAIR_WALK: 190,
  JUMP: 830,
  COYOTE: 0.09,
  JBUF: 0.12,
  PH: 70,             // player height
  PW: 13,             // player half width
  ST: 28,             // stair slab thickness
  STAIR_COOLDOWN: 0.28,
  DT: 1 / 120,
  DEATH_MARGIN: 160,
};

const DEG = Math.PI / 180;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function sign(v) { return v > 0 ? 1 : v < 0 ? -1 : 0; }

// ---------- world construction ----------
function createWorld(room, opts) {
  opts = opts || {};
  const w = {
    room,
    t: 0,
    memoryTaken: !!opts.memoryTaken,
    exitOpen: !!opts.memoryTaken || !room.memory,
    platforms: [],
    stairs: [],
    levers: [],
    player: null,
    events: [],
    done: false,
  };
  for (const p of room.platforms) {
    const m = p.move;
    w.platforms.push({
      id: p.id, x0: p.x, y0: p.y, w: p.w, h: p.h || 26,
      x: p.x, y: p.y, vx: 0, vy: 0,
      move: m ? {
        dx: m.dx || 0, dy: m.dy || 0, speed: m.speed || 120,
        mode: m.mode || 'toggle', // 'toggle' | 'loop'
        u: m.u0 || 0, target: m.u0 || 0, active: !!m.active, dir: 1, pause: m.pause || 0, wait: 0,
      } : null,
      kind: p.kind || 'slab',
      crumble: !!p.crumble, touched: false, shake: 0, gone: false, fallY: 0,
    });
  }
  // crates: pushable blocks that behave as dynamic platforms
  for (const c of room.crates || []) {
    w.platforms.push({
      id: c.id, x0: c.x - 22, y0: c.y - 44, w: 44, h: 44, x: c.x - 22, y: c.y - 44, vx: 0, vy: 0,
      move: null, kind: 'crate', cvy: 0, support: null, crumble: false, gone: false,
    });
  }
  w.plates = [];
  for (const pl of room.plates || []) w.plates.push({ x: pl.x, plat: pl.plat, dx: 0, w: pl.w || 70, actions: pl.actions || [], down: false, anim: 0 });
  for (const s of room.stairs || []) {
    w.stairs.push({
      id: s.id, x: s.x, y: s.y, len: s.len || 440,
      ang: (s.ang || 0) * DEG, angVel: 0,
      kind: s.kind || 'rot', // rot | weight | static
      on: !!s.on, dir: s.dir || 1, speed: (s.speed || 28) * DEG,
      min: (s.min != null ? s.min : -40) * DEG, max: (s.max != null ? s.max : 40) * DEG,
      rest: (s.rest != null ? s.rest : (s.ang || 0)) * DEG,
      steps: s.steps || 12,
      flip: !!s.flip,
      ride: !!s.ride,                 // rotates only while Hazop is on it
      link: s.link || null, ratio: s.ratio != null ? s.ratio : -1, // geared to another stair
      ang0: (s.ang || 0) * DEG,
    });
  }
  // geared stairs are updated after the stair they follow
  w.stairs.sort((a, b) => (a.link ? 1 : 0) - (b.link ? 1 : 0));
  for (const l of room.levers || []) {
    w.levers.push({ hits: 0, x: l.x, plat: l.plat, dx: 0, state: !!l.state, inside: false, actions: l.actions || [], anim: l.state ? 1 : 0,
      type: l.type || 'switch', time: l.time || 5, timer: 0, locked: false });
  }
  for (const L of w.levers) {
    const p = w.platforms.find(p => p.id === L.plat);
    L.dx = L.x - p.x0;
  }
  for (const pl of w.plates) { const p = w.platforms.find(p => p.id === pl.plat); pl.dx = pl.x - p.x0; }
  if (room.memory) {
    const m = room.memory;
    w.mem = { x: m.x, y: m.y, dx: 0, dy: 0, plat: m.plat };
    if (m.plat) { const p = w.platforms.find(p => p.id === m.plat); w.mem.dx = m.x - p.x0; w.mem.dy = m.y - p.y0; }
  }
  const sp = room.spawn;
  w.player = {
    x: sp.x, y: sp.y, vx: 0, vy: 0, state: 'air', facing: 1,
    plat: null, stair: null, s: 0, side: 1, ux: 0, uy: -1,
    coyote: 0, jbuf: 0, cool: {}, lockMove: 0, lockSign: 0,
    walkPhase: 0, airTime: 0, landed: false,
  };
  return w;
}

// ---------- helpers ----------
function stairTN(st) {
  const c = Math.cos(st.ang), s = Math.sin(st.ang);
  return { tx: c, ty: s, nx: s, ny: -c }; // n = "top" (teeth) side
}
function stairFeetOffset(side) { return side > 0 ? PHYS.ST / 2 - 3 : PHYS.ST / 2; }

function platById(w, id) { return w.platforms.find(p => p.id === id); }
function stairById(w, id) { return w.stairs.find(s => s.id === id); }

// ---------- lever actions ----------
function invertAction(a) {
  const r = Object.assign({}, a);
  if (a.on === true) r.on = false; else if (a.on === false) r.on = true;
  if (a.op === 'on') r.op = 'off'; else if (a.op === 'off') r.op = 'on';
  if (a.dir) { delete r.dir; r.invert = true; }
  return r; // 'toggle' and 'invert' are their own inverse
}
function runActions(w, actions, undo) {
  if (undo) actions = actions.map(invertAction).reverse();
  for (const a of actions) {
    if (a.stair != null) {
      const st = stairById(w, a.stair);
      if (!st) continue;
      if (a.on === 'toggle') st.on = !st.on; else if (a.on != null) st.on = a.on;
      if (a.invert) st.dir = -st.dir;
      if (a.dir) st.dir = a.dir;
    }
    if (a.plat != null) {
      const p = platById(w, a.plat);
      if (!p || !p.move) continue;
      const m = p.move;
      if (m.mode === 'toggle') {
        if (a.op === 'toggle' || !a.op) m.target = m.target > 0.5 ? 0 : 1;
        else if (a.op === 'on') m.target = 1; else if (a.op === 'off') m.target = 0;
      } else {
        if (a.op === 'toggle' || !a.op) m.active = !m.active;
        else if (a.op === 'on') m.active = true; else if (a.op === 'off') m.active = false;
      }
    }
  }
}

// ---------- stepping ----------
function stepWorld(w, input, dt) {
  dt = dt || PHYS.DT;
  const ev = w.events;
  const P = w.player;
  w.t += dt;

  // --- platforms ---
  for (const p of w.platforms) {
    const ox = p.x, oy = p.y;
    const m = p.move;
    if (m) {
      const L = Math.hypot(m.dx, m.dy) || 1;
      const du = (m.speed / L) * dt;
      if (m.mode === 'toggle') {
        if (m.u < m.target) m.u = Math.min(m.target, m.u + du);
        else if (m.u > m.target) m.u = Math.max(m.target, m.u - du);
      } else if (m.active) {
        if (m.wait > 0) m.wait -= dt;          // dwell at the ends of the run
        else {
          m.u += du * m.dir;
          if (m.u >= 1) { m.u = 1; m.dir = -1; m.wait = m.pause; } else if (m.u <= 0) { m.u = 0; m.dir = 1; m.wait = m.pause; }
        }
      }
      // smooth easing for position
      const e = m.mode === 'toggle' ? m.u * m.u * (3 - 2 * m.u) : m.u;
      p.x = p.x0 + m.dx * e; p.y = p.y0 + m.dy * e;
    }
    p.vx = (p.x - ox) / dt; p.vy = (p.y - oy) / dt;
    p.mdx = p.x - ox; p.mdy = p.y - oy;
  }

  // --- stairs ---
  for (const st of w.stairs) {
    st.prevAng = st.ang;
    if (st.link) {
      const L = stairById(w, st.link);
      st.angVel = L.angVel * st.ratio;
      st.ang = st.ang0 + (L.ang - L.ang0) * st.ratio;
    } else if (st.kind === 'rot') {
      const riding = P.state === 'stair' && P.stair === st.id;
      st.angVel = st.on && (!st.ride || riding) ? st.dir * st.speed : 0;
      st.ang += st.angVel * dt;
    } else if (st.kind === 'weight') {
      let torque = 0;
      if (P.state === 'stair' && P.stair === st.id) torque = (P.x - st.x) * 0.0045; // px -> rad/s^2
      const spring = (st.rest - st.ang) * 0.8;
      st.angVel += (torque + spring - st.angVel * 1.4) * dt;
      st.ang += st.angVel * dt;
      if (st.ang < st.min) { st.ang = st.min; st.angVel = 0; }
      if (st.ang > st.max) { st.ang = st.max; st.angVel = 0; }
    }
  }

  // --- crumbling platforms ---
  for (const p of w.platforms) {
    if (!p.crumble || p.gone) continue;
    const onIt = P.state === 'ground' && P.plat === p.id;
    if (onIt) p.touched = true;
    else if (p.touched && p.shake === 0) { p.shake = 0.0001; ev.push({ type: 'crumble', x: p.x + p.w / 2, y: p.y }); }
    if (p.shake > 0) { p.shake += dt; if (p.shake > 0.45) { p.gone = true; ev.push({ type: 'crumbled', x: p.x + p.w / 2, y: p.y }); } }
  }
  // --- crates: gravity, resting, carried by movers ---
  for (const c of w.platforms) {
    if (c.kind !== 'crate') continue;
    const ox = c.x, oy = c.y;
    let sup = null;
    for (const q of w.platforms) {
      if (q === c || q.gone) continue;
      if (c.x + c.w > q.x + 2 && c.x < q.x + q.w - 2 && Math.abs((c.y + c.h) - q.y) < 2) { sup = q; break; }
    }
    if (sup) { c.cvy = 0; c.x += sup.mdx || 0; c.y = sup.y - c.h; }
    else {
      c.cvy = Math.min(PHYS.MAX_FALL, c.cvy + PHYS.G * dt);
      const bottom0 = c.y + c.h; c.y += c.cvy * dt;
      for (const q of w.platforms) {
        if (q === c || q.gone) continue;
        if (c.x + c.w > q.x + 2 && c.x < q.x + q.w - 2 && bottom0 <= q.y - (q.mdy || 0) + 1 && c.y + c.h >= q.y) { c.y = q.y - c.h; c.cvy = 0; ev.push({ type: 'crateland', x: c.x + c.w / 2, y: q.y }); break; }
      }
      if (c.y > w.room.h + 200) { c.x = c.x0; c.y = c.y0 - 200; c.cvy = 0; ev.push({ type: 'crateback' }); }
    }
    c.mdx = c.x - ox; c.mdy = c.y - oy;
  }

  // --- input buffers ---
  const move = input.move || 0;
  if (input.jump) P.jbuf = PHYS.JBUF; else P.jbuf = Math.max(0, P.jbuf - dt);
  for (const k in P.cool) { P.cool[k] -= dt; if (P.cool[k] <= 0) delete P.cool[k]; }

  if (P.state === 'stair') updateOnStair(w, P, move, dt, ev);
  else updateGroundAir(w, P, move, dt, ev);

  // --- levers ---
  for (const L of w.levers) {
    const p = platById(w, L.plat);
    const lx = p.x + L.dx, ly = p.y;
    const inside = P.state === 'ground' && P.plat === p.id && Math.abs(P.x - lx) < 24 && Math.abs(P.y - ly) < 3;
    L.cool = Math.max(0, (L.cool || 0) - dt);
    if (L.type === 'timer' && L.timer > 0) {
      const before = Math.ceil(L.timer);
      L.timer -= dt;
      if (Math.ceil(L.timer) !== before && L.timer > 0) ev.push({ type: 'tick', x: lx, y: ly });
      if (L.timer <= 0) { L.timer = 0; L.state = false; runActions(w, L.actions, true); ev.push({ type: 'timeup', x: lx, y: ly }); }
    }
    const usable = !L.locked && !(L.type === 'timer' && L.timer > 0);
    if (inside && !L.inside && L.cool <= 0 && usable) {
      L.cool = 0.7;
      L.state = !L.state; L.hits++;
      runActions(w, L.actions, !L.state); // switched back = undo
      if (L.type === 'once') { L.locked = true; ev.push({ type: 'lock', x: lx, y: ly }); }
      if (L.type === 'timer') L.timer = L.time;
      ev.push({ type: 'lever', x: lx, y: ly, kind: L.type });
    }
    L.inside = inside;
    L.anim += ((L.state ? 1 : 0) - L.anim) * Math.min(1, dt * 10);
  }

  // --- pressure plates: held down by Hazop or a crate ---
  for (const pl of w.plates) {
    const p = platById(w, pl.plat);
    const px = p.x + pl.dx, py = p.y;
    let down = P.state === 'ground' && P.plat === p.id && Math.abs(P.x - px) < pl.w / 2 + 6;
    for (const c of w.platforms) if (c.kind === 'crate' && Math.abs(c.y + c.h - py) < 3 && c.x + c.w > px - pl.w / 2 && c.x < px + pl.w / 2) down = true;
    if (down !== pl.down) { pl.down = down; runActions(w, pl.actions, !down); ev.push({ type: 'plate', down, x: px, y: py }); }
    pl.anim += ((down ? 1 : 0) - pl.anim) * Math.min(1, dt * 14);
  }

  // --- memory ---
  const mem = w.mem;
  if (mem && mem.plat) { const p = platById(w, mem.plat); mem.x = p.x + mem.dx; mem.y = p.y + mem.dy; }
  if (mem && !w.memoryTaken) {
    const cx = P.x + P.ux * PHYS.PH * 0.45, cy = P.y + P.uy * PHYS.PH * 0.45;
    if (Math.hypot(cx - mem.x, cy - mem.y) < 46 || Math.hypot(P.x - mem.x, P.y - mem.y) < 34) {
      w.memoryTaken = true; w.exitOpen = true;
      ev.push({ type: 'memory', id: w.room.memory.id, x: mem.x, y: mem.y });
    }
  }

  // --- exit ---
  const ex = w.room.exit;
  if (w.exitOpen && ex && !w.done) {
    const cx = P.x + P.ux * PHYS.PH * 0.45, cy = P.y + P.uy * PHYS.PH * 0.45;
    if (cx > ex.x && cx < ex.x + ex.w && cy > ex.y && cy < ex.y + ex.h) {
      w.done = true; ev.push({ type: 'exit' });
    }
  }

  // --- death ---
  if (!w.done && (P.y > w.room.h + PHYS.DEATH_MARGIN || P.y < -900 || P.x < -400 || P.x > w.room.w + 400)) {
    w.done = true; w.dead = true; ev.push({ type: 'death' });
  }
}

function updateGroundAir(w, P, move, dt, ev) {
  const room = w.room;
  // orientation relaxes to upright
  P.ux = 0; P.uy = -1;
  if (move) P.facing = move;

  // carried by platform
  if (P.state === 'ground' && P.plat != null) {
    const p = platById(w, P.plat);
    P.x += p.mdx || 0; P.y += p.mdy || 0;
  }

  // horizontal
  const target = move * PHYS.WALK;
  if (P.state === 'ground') {
    P.vx = target;
  } else {
    const acc = PHYS.AIR_ACC * dt;
    if (move) P.vx += clamp(target - P.vx, -acc, acc);
    else P.vx *= Math.pow(0.35, dt); // gentle air drag
  }

  // jump
  if (P.state === 'ground') P.coyote = PHYS.COYOTE; else P.coyote = Math.max(0, P.coyote - dt);
  if (P.jbuf > 0 && P.coyote > 0) {
    P.vy = -PHYS.JUMP;
    if (P.plat != null) { const p = platById(w, P.plat); P.vy += Math.min(0, p.vy); P.vx += p.vx * 0.5; }
    P.state = 'air'; P.plat = null; P.coyote = 0; P.jbuf = 0;
    ev.push({ type: 'jump' });
  }

  // gravity
  if (P.state !== 'ground') { P.vy = Math.min(PHYS.MAX_FALL, P.vy + PHYS.G * dt); P.airTime += dt; }
  else P.vy = 0;

  // move X
  P.x += P.vx * dt;
  const PW = PHYS.PW, PH = PHYS.PH;
  for (const p of w.platforms) {
    if (p.gone) continue;
    if (P.y > p.y + 0.5 && P.y - PH < p.y + p.h && P.x + PW > p.x && P.x - PW < p.x + p.w) {
      if (p.kind === 'crate' && P.state === 'ground' && move && Math.abs(P.y - (p.y + p.h)) < 4) {
        // push the crate (slower walk), unless something blocks it
        const dir = move, pen = dir > 0 ? (P.x + PW) - p.x : p.x + p.w - (P.x - PW);
        const step = dir * Math.min(pen, 150 * dt + 0.5);
        let blocked = p.x + step < 0 || p.x + p.w + step > room.w;
        for (const q of w.platforms) {
          if (q === p || q.gone) continue;
          if (p.y + p.h > q.y + 1 && p.y < q.y + q.h && p.x + step + p.w > q.x && p.x + step < q.x + q.w) { blocked = true; break; }
        }
        if (!blocked) { p.x += step; P.vx = dir * 150; p.pushT = (p.pushT || 0) + dt; if (p.pushT > 0.22) { p.pushT = 0; ev.push({ type: 'push' }); } }
      }
      if (P.state === 'air' && P.y - p.y < 24 && P.vy > -260) { // ledge assist
        P.y = p.y; P.vy = 0; P.state = 'ground'; P.plat = p.id; P.x = Math.max(p.x + 2, Math.min(p.x + p.w - 2, P.x));
        ev.push({ type: 'land', hard: false }); P.airTime = 0; continue;
      }
      if (P.vx > 0 || p.mdx < 0) { if (P.x < p.x + p.w / 2) P.x = p.x - PW; }
      if (P.vx < 0 || p.mdx > 0) { if (P.x >= p.x + p.w / 2) P.x = p.x + p.w + PW; }
    }
  }
  // room walls
  if (P.x < PW) { P.x = PW; P.vx = 0; }
  if (!(w.exitOpen && room.exit && room.exit.x >= room.w - 80) && P.x > room.w - PW) { P.x = room.w - PW; P.vx = 0; }

  // move Y
  const oy = P.y;
  P.y += P.vy * dt;
  let grounded = false;
  if (P.state === 'ground') {
    // stay glued if still above the platform
    const p = platById(w, P.plat);
    if (p && !p.gone && P.x + PW > p.x && P.x - PW < p.x + p.w) { P.y = p.y; grounded = true; }
    else {
      // look for another platform at same level
      for (const q of w.platforms) {
        if (q.gone) continue;
        if (Math.abs(q.y - P.y) < 6 && P.x + PW > q.x && P.x - PW < q.x + q.w) { P.y = q.y; P.plat = q.id; grounded = true; break; }
      }
    }
    if (!grounded) { P.state = 'air'; P.plat = null; P.airTime = 0; }
  } else {
    for (const p of w.platforms) {
      if (p.gone) continue;
      if (P.x + PW <= p.x || P.x - PW >= p.x + p.w) continue;
      // landing: feet crossed the top surface (account for platform motion)
      if (P.vy >= 0 && oy <= p.y - p.mdy + 1 && P.y >= p.y) {
        P.y = p.y; P.vy = 0; P.state = 'ground'; P.plat = p.id; grounded = true;
        ev.push({ type: 'land', hard: P.airTime > 0.45 });
        P.airTime = 0;
        break;
      }
      // head bump
      if (P.vy < 0 && oy - PH >= p.y + p.h - 1 && P.y - PH < p.y + p.h) {
        P.y = p.y + p.h + PH; P.vy = 0;
      }
    }
  }

  // walk cycle
  if (P.state === 'ground' && move) {
    const before = Math.floor(P.walkPhase / Math.PI);
    P.walkPhase += dt * 11;
    if (Math.floor(P.walkPhase / Math.PI) !== before) ev.push({ type: 'step', surface: 'stone' });
  } else if (P.state === 'ground') P.walkPhase = 0;

  // stair attachment (airborne only)
  if (P.state === 'air') tryAttach(w, P, ev);
}

function tryAttach(w, P, ev) {
  const PH = PHYS.PH, half = PHYS.ST / 2;
  for (const st of w.stairs) {
    if (P.cool[st.id]) continue;
    const { tx, ty, nx, ny } = stairTN(st);
    let hit = false;
    for (let k = 0; k <= 4; k++) {
      const sx = P.x, sy = P.y - PH * (k / 4);
      const rx = sx - st.x, ry = sy - st.y;
      const a = rx * tx + ry * ty, d = rx * nx + ry * ny;
      if (Math.abs(a) <= st.len / 2 && Math.abs(d) <= half + 4) { hit = true; break; }
    }
    if (!hit) continue;
    const cx = P.x - st.x, cy = P.y - PH / 2 - st.y;
    const dc = cx * nx + cy * ny;
    let side;
    if (Math.abs(dc) > half) side = sign(dc);
    else side = (P.vx * nx + P.vy * ny) < 0 ? 1 : -1;
    const a = clamp(cx * tx + cy * ty, -st.len / 2 + 8, st.len / 2 - 8);
    P.state = 'stair'; P.stair = st.id; P.s = a; P.side = side; P.plat = null; P.stairTime = 0;
    P.lockMove = 0; P.lockSign = 0;
    placeOnStair(P, st);
    ev.push({ type: 'attach', hard: P.airTime > 0.45 });
    P.airTime = 0;
    return;
  }
}

function placeOnStair(P, st) {
  const { tx, ty, nx, ny } = stairTN(st);
  const off = stairFeetOffset(P.side);
  P.ux = nx * P.side; P.uy = ny * P.side;
  P.x = st.x + tx * P.s + P.ux * off;
  P.y = st.y + ty * P.s + P.uy * off;
}

function updateOnStair(w, P, move, dt, ev) {
  const st = stairById(w, P.stair);
  const { tx, ty } = stairTN(st);
  const ox = P.x, oy = P.y;
  // input mapping (locked while held, so rotating stairs don't flip controls mid-walk)
  if (!move) { P.lockMove = 0; }
  else if (move !== P.lockMove) {
    P.lockMove = move;
    const ux = P.side * Math.sin(st.ang), uy = P.side * -Math.cos(st.ang);
    if (Math.abs(tx) > 0.3) P.lockSign = sign(tx) * move;
    else { const rx = -uy, ry = ux; P.lockSign = sign(rx * tx + ry * ty) * move || move; }
  }
  let ds = 0;
  if (move) ds = P.lockSign * PHYS.STAIR_WALK * dt;
  const lim = st.len / 2 - 10;
  // walking past the end of a stair wraps Hazop around it onto the other face
  const pushingEnd = move && Math.abs(P.s + ds) > lim && Math.abs(P.s) >= lim - 0.5 && P.jbuf <= 0;
  P.endPush = pushingEnd ? (P.endPush || 0) + dt : 0;
  if (P.endPush > 0.3) {
    P.side = -P.side; P.lockSign = -P.lockSign; P.facing = -P.facing; ds = 0; P.endPush = 0;
    ev.push({ type: 'wrap', x: P.x, y: P.y });
  }
  const ns = clamp(P.s + ds, -lim, lim);
  const moved = Math.abs(ns - P.s) > 0.01;
  P.s = ns;
  placeOnStair(P, st);
  // facing: direction of travel in local frame
  if (moved) {
    const rx = -P.uy, ry = P.ux; // local right
    P.facing = sign((tx * P.lockSign) * rx + (ty * P.lockSign) * ry) || P.facing;
    const before = Math.floor(P.walkPhase / Math.PI);
    P.walkPhase += dt * 11;
    if (Math.floor(P.walkPhase / Math.PI) !== before) ev.push({ type: 'step', surface: 'stair' });
  } else P.walkPhase = 0;

  P.vx = (P.x - ox) / dt; P.vy = (P.y - oy) / dt;
  // carried velocity from rotation only (walking contribution kept small)
  P.stairTime = (P.stairTime || 0) + dt;
  if (P.jbuf > 0 && P.stairTime >= 0.25) {
    const upness = clamp((-P.uy + 0.25) / 1.25, 0, 1);
    const power = PHYS.JUMP * (0.3 + 0.7 * upness);
    P.vx = P.vx + P.ux * power;
    P.vy = P.vy + P.uy * power;
    P.state = 'air'; P.cool[st.id] = PHYS.STAIR_COOLDOWN; P.stair = null; P.jbuf = 0; P.airTime = 0;
    // in the air the body is upright again: shift so the feet stay continuous visually
    ev.push({ type: 'jump', fromStair: true });
  }
}

function drawTitleWord(ctx, text, cx, baseline, capPx, spacing, fill, shadow) {
  const k = capPx / TITLE_FONT.capH, gap = spacing * capPx;
  let w = 0; for (const ch of text) w += TITLE_FONT.g[ch].w * k + gap; w -= gap;
  const draw = (dx, dy, col) => {
    let x = cx - w / 2 + dx;
    ctx.save(); ctx.fillStyle = col;
    for (const ch of text) {
      const g = TITLE_FONT.g[ch];
      ctx.save(); ctx.translate(x, baseline + dy); ctx.scale(k, -k); ctx.fill(new Path2D(g.d)); ctx.restore();
      x += g.w * k + gap;
    }
    ctx.restore();
  };
  if (shadow) draw(capPx * 0.04, capPx * 0.04, shadow);
  draw(0, 0, fill);
  return w;
}

const VIEW_W = 1600, VIEW_H = 900;
const COL = {
  white: '#FFFFFF', yellow: '#FFFF92', mint: '#9EFCB2', green: '#76AE81', brown: '#402C2D',
  ink: '#1b1515', inkHi: '#3b302d', red: '#c8302a', gray: '#8d8a84', letter: '#1d1515',
};

function rng(seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(h, f) { // f: -1..1
  const [r, g, b] = hexToRgb(h);
  const m = f < 0 ? 0 : 255, k = Math.abs(f);
  return `rgb(${Math.round(r + (m - r) * k)},${Math.round(g + (m - g) * k)},${Math.round(b + (m - b) * k)})`;
}
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }

// ---------- painterly helpers ----------
function paintShape(ctx, R, pathFn, base, opt) {
  opt = opt || {};
  ctx.save();
  ctx.beginPath(); pathFn(ctx); ctx.closePath();
  ctx.fillStyle = base; ctx.fill();
  ctx.clip();
  const b = opt.bounds || [0, 0, 2600, 900];
  const n = opt.n || Math.round((b[2] * b[3]) / 900);
  const ang = opt.angle != null ? opt.angle : -0.3;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = b[0] + R() * b[2], y = b[1] + R() * b[3];
    const len = 8 + R() * (opt.len || 26);
    const a = ang + (R() - 0.5) * 0.6;
    const f = (R() - 0.5) * (opt.var || 0.18);
    ctx.strokeStyle = shade(base, f); ctx.globalAlpha = 0.25 + R() * 0.35;
    ctx.lineWidth = 1.5 + R() * 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
  }
  ctx.restore();
}
function rectPath(x, y, w, h) { return c => c.rect(x, y, w, h); }
function polyPath(pts) { return c => { c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); }; }

function arcade(ctx, R, x, y, w, h, n, wall, hole, opt) {
  opt = opt || {};
  paintShape(ctx, R, rectPath(x, y, w, h), wall, { bounds: [x, y, w, h], n: w * h / 500 });
  const aw = w / n;
  for (let i = 0; i < n; i++) {
    const ax = x + i * aw + aw * 0.18, aww = aw * 0.64, top = y + (opt.archTop || h * 0.22), bot = y + h;
    const r = aww / 2;
    paintShape(ctx, R, c => { c.moveTo(ax, bot); c.lineTo(ax, top + r); c.arc(ax + r, top + r, r, Math.PI, 0); c.lineTo(ax + aww, bot); }, hole, { bounds: [ax, top, aww, bot - top], n: 60, var: 0.12 });
    // lit inner edge
    ctx.strokeStyle = rgba('#fff6c0', 0.35); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ax + aww, bot); ctx.lineTo(ax + aww, top + r); ctx.arc(ax + r, top + r, r, 0, -Math.PI / 2, true); ctx.stroke();
  }
}

function sky(ctx, w, top, bot, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon + 4);
}

function ground(ctx, R, w, horizon, col) {
  paintShape(ctx, R, rectPath(0, horizon, w, VIEW_H - horizon), col, { bounds: [0, horizon, w, VIEW_H - horizon], angle: 0.05 });
}
function longShadow(ctx, pts, a) {
  ctx.fillStyle = rgba('#2a1d1c', a || 0.55);
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill();
}
function ghostStair(ctx, x, y, len, ang, a, col, blur) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = a;
  if (blur) ctx.filter = 'blur(' + blur + 'px)';
  ctx.fillStyle = col || '#3a2c2a';
  stairPath(ctx, len, 10, 16); ctx.fill();
  ctx.restore();
}

function buildBackground(tag, roomW, seed) {
  const wb = Math.ceil(VIEW_W + (roomW - VIEW_W) * 0.15) + 4;
  const wm = Math.ceil(VIEW_W + (roomW - VIEW_W) * 0.45) + 4;
  const mk = w => { const c = document.createElement('canvas'); c.width = w; c.height = VIEW_H; return c; };
  const back = mk(wb), mid = mk(wm);
  const R = rng(seed);
  SCENES[tag](back.getContext('2d'), mid.getContext('2d'), R, wb, wm);
  return { back, mid, wb, wm };
}

// ---------- foreground primitives ----------
function stairPath(ctx, len, n, th) {
  // local frame: x along the stair, teeth (steps) on the -y side, flat underside at +y
  const sw = len / n, bot = th / 2 - 2, base = -2, tip = -th / 2 - 4;
  ctx.beginPath();
  ctx.moveTo(-len / 2, bot);
  ctx.lineTo(len / 2, bot);
  ctx.lineTo(len / 2, tip);
  for (let i = n; i > 0; i--) {
    const x1 = -len / 2 + i * sw;
    ctx.lineTo(x1 - sw * 0.55, tip);          // tread
    ctx.lineTo(x1 - sw * 0.55, base);         // riser down
    ctx.lineTo(x1 - sw, base);                // gap
    if (i > 1) ctx.lineTo(x1 - sw, tip);      // next riser up
  }
  ctx.lineTo(-len / 2, base);
  ctx.closePath();
}

function drawStair(ctx, st, t) {
  ctx.save();
  ctx.translate(st.x, st.y);
  if (st.kind === 'weight') {
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(-22, 46); ctx.lineTo(22, 46); ctx.closePath(); ctx.fill();
  }
  ctx.rotate(st.ang);
  // soft shadow
  ctx.save(); ctx.translate(10, 14); ctx.fillStyle = 'rgba(40,25,20,.18)'; stairPath(ctx, st.len, st.steps, 28); ctx.fill(); ctx.restore();
  ctx.fillStyle = COL.ink;
  stairPath(ctx, st.len, st.steps, 28); ctx.fill();
  // pivot
  if (st.link || st.gear) {           // geared pair: a cog at the pivot
    ctx.fillStyle = COL.ink; ctx.beginPath();
    for (let i = 0; i < 20; i++) { const a = i * Math.PI / 10, r = i % 2 ? 13 : 17; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f4f0dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.stroke();
    if (st.ride) { ctx.fillStyle = '#f4f0dc'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 7); ctx.fill(); }
  } else if (st.ride) {               // turns only with Hazop on it: a hollow pivot with a dot
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f4f0dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.stroke();
    ctx.fillStyle = '#f4f0dc'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f4f0dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

// the chain that ties two geared stairs
function drawGearLink(ctx, a, b) {
  ctx.save(); ctx.strokeStyle = 'rgba(27,21,21,.35)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
}

function drawPlatform(ctx, p, t) {
  if (p.gone) return;
  if (p.kind === 'crate') { drawCrate(ctx, p); return; }
  if (p.crumble) { drawCrumbling(ctx, p, t || 0); return; }
  ctx.fillStyle = 'rgba(40,25,20,.18)'; ctx.fillRect(p.x + 10, p.y + 12, p.w, Math.min(p.h, 60));
  ctx.fillStyle = COL.ink; ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = COL.inkHi; ctx.fillRect(p.x, p.y, p.w, 3);
  if (p.move) { // tiny rails hint for movers
    ctx.fillStyle = 'rgba(240,235,210,.5)';
    for (let i = 0; i < 3; i++) ctx.fillRect(p.x + p.w / 2 - 14 + i * 12, p.y + p.h / 2 - 2, 6, 4);
  }
}

function drawCrumbling(ctx, p, t) {
  const sh = p.shake > 0 ? Math.sin(t * 90) * 2.5 : 0;
  ctx.save(); ctx.translate(sh, p.shake > 0 ? p.shake * 6 : 0);
  ctx.fillStyle = 'rgba(40,25,20,.15)'; ctx.fillRect(p.x + 10, p.y + 12, p.w, p.h);
  ctx.fillStyle = '#3a2f2b'; ctx.fillRect(p.x, p.y, p.w, p.h);
  // separate stones with cracks
  ctx.strokeStyle = '#a89c86'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = p.x + 28; x < p.x + p.w; x += 34) { ctx.moveTo(x, p.y); ctx.lineTo(x - 5, p.y + p.h * 0.55); ctx.lineTo(x + 3, p.y + p.h); }
  ctx.moveTo(p.x + 6, p.y + p.h * 0.5); ctx.lineTo(p.x + 20, p.y + p.h * 0.45);
  ctx.stroke();
  ctx.fillStyle = '#5a4c44'; ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.restore();
}

function drawCrate(ctx, c) {
  ctx.fillStyle = 'rgba(40,25,20,.18)'; ctx.fillRect(c.x + 8, c.y + 10, c.w, c.h);
  ctx.fillStyle = COL.ink; ctx.fillRect(c.x, c.y, c.w, c.h);
  ctx.strokeStyle = '#f4f0dc'; ctx.lineWidth = 2; ctx.strokeRect(c.x + 7, c.y + 7, c.w - 14, c.h - 14);
  ctx.fillStyle = '#f4f0dc'; ctx.beginPath(); ctx.arc(c.x + c.w / 2, c.y + c.h / 2, 4, 0, 7); ctx.fill();
}

function drawPlate(ctx, x, y, w, anim) {
  const h = 13 - anim * 8;
  ctx.fillStyle = COL.ink; ctx.fillRect(x - w / 2 - 5, y - 4, w + 10, 4);
  ctx.fillStyle = anim > 0.5 ? '#f3dc6e' : '#efe4c0'; ctx.fillRect(x - w / 2, y - h - 3, w, h);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2, y - h - 2, w, h);
}

function drawLever(ctx, x, y, anim, L) {
  L = L || {};
  if (L.type === 'once') {           // rusty one-way hinge: red knob, padlock once used
    ctx.save(); ctx.translate(x, y);
    const a = -Math.PI / 2 + (anim * 2 - 1) * 0.6;
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30); ctx.stroke();
    ctx.fillStyle = '#8f2a1e'; ctx.beginPath(); ctx.arc(Math.cos(a) * 30, Math.sin(a) * 30, 8, 0, 7); ctx.fill();
    ctx.fillStyle = COL.ink; ctx.fillRect(-9, -5, 18, 5);
    if (L.locked) { ctx.fillStyle = COL.ink; ctx.fillRect(14, -16, 14, 11); ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(21, -16, 5, Math.PI, 0); ctx.stroke(); }
    ctx.restore(); return;
  }
  if (L.type === 'timer') {          // hourglass lever with a countdown ring
    ctx.save(); ctx.translate(x, y);
    const a = -Math.PI / 2 + (anim * 2 - 1) * 0.6;
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30); ctx.stroke();
    const kx = Math.cos(a) * 30, ky = Math.sin(a) * 30;
    ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.moveTo(kx - 7, ky - 9); ctx.lineTo(kx + 7, ky - 9); ctx.lineTo(kx - 7, ky + 9); ctx.lineTo(kx + 7, ky + 9); ctx.closePath(); ctx.fill();
    if (L.timer > 0) { ctx.strokeStyle = 'rgba(255,248,210,.95)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(kx, ky, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (L.timer / L.time)); ctx.stroke(); }
    ctx.beginPath(); ctx.fillStyle = COL.ink; ctx.arc(0, 0, 6, Math.PI, 0); ctx.fill();
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(x, y);
  const a = -Math.PI / 2 + (anim * 2 - 1) * 0.6;
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30); ctx.stroke();
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(Math.cos(a) * 30, Math.sin(a) * 30, 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 6, Math.PI, 0); ctx.fill();
  ctx.restore();
}

function drawExitArrow(ctx, ex, room, open, t) {
  const left = ex.x < room.w / 2;
  const cx = left ? 70 : room.w - 80, cy = ex.y + ex.h / 2;
  ctx.save(); ctx.translate(cx, cy); if (left) ctx.scale(-1, 1);
  ctx.globalAlpha = open ? 0.55 + Math.sin(t * 3) * 0.15 : 0.12;
  if (open) ctx.translate(Math.sin(t * 3) * 6, 0);
  ctx.fillStyle = '#5f5c58';
  ctx.beginPath(); ctx.moveTo(-50, -16); ctx.lineTo(4, -16); ctx.lineTo(4, -42); ctx.lineTo(50, 0); ctx.lineTo(4, 42); ctx.lineTo(4, 16); ctx.lineTo(-50, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMemory(ctx, x, y, id, t) {
  // light cone from above + glow
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x, y - 420, x, y + 40);
  g.addColorStop(0, 'rgba(255,250,210,0)'); g.addColorStop(1, 'rgba(255,248,200,.30)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 20, y - 420); ctx.lineTo(x + 20, y - 420); ctx.lineTo(x + 70, y + 36); ctx.lineTo(x - 70, y + 36); ctx.fill();
  const r = 80 + Math.sin(t * 2.2) * 8;
  const rg = ctx.createRadialGradient(x, y, 4, x, y, r);
  rg.addColorStop(0, 'rgba(255,250,220,.75)'); rg.addColorStop(0.4, 'rgba(255,235,160,.30)'); rg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 4); ic(ctx, ICONS[id] || ICONS.pnt_painting); ctx.restore();
}

// ---------- Hazop as a real man (from the 16th memory on) ----------
// Realistic proportions: height 72 px, head ~1/7.5 of the body. Colours go
// from washed-out grey to full life as the last memories come back (k: 0..1).
function mixCol(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function drawHuman(ctx, P, n, opt) {
  const k = Math.max(0, Math.min(1, (n - 15) / 6));
  const G = '#9b978f';
  const C = {
    skin: mixCol(G, '#e2b48c', k), skinSh: mixCol('#7c7870', '#c49170', k),
    hair: mixCol('#6a6660', '#3a2a20', k), suit: mixCol(G, '#4f4034', k), suitSh: mixCol('#7c7870', '#3d3128', k),
    pants: mixCol(G, '#3a4456', k), pantsSh: mixCol('#7c7870', '#2c3444', k),
    shirt: '#f2efe6', tie: mixCol('#8a8680', '#a82228', k), shoe: '#2b1f19', line: '#2a2120',
  };
  const ang = opt.angle || 0, face = P.facing || 1, moving = opt.moving, air = opt.air;
  const ph = P.walkPhase || 0, sw = moving ? Math.sin(ph) : 0;
  ctx.save();
  ctx.translate(P.x, P.y); ctx.rotate(ang); ctx.scale(face * (opt.scale || 1), opt.scale || 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const seg = (pts, w, col) => { // outlined limb through points
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = C.line; ctx.lineWidth = w + 1.6; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  };
  const leg = (a, knee, col) => {
    const hip = [0, -36];
    const kn = [hip[0] + Math.sin(a) * 17, hip[1] + Math.cos(a) * 17];
    const b = a - knee;
    const an = [kn[0] + Math.sin(b) * 16, kn[1] + Math.cos(b) * 16];
    seg([hip, kn, an], 5.2, col);
    // shoe
    ctx.save(); ctx.translate(an[0], an[1]); ctx.rotate(-b * 0.5);
    ctx.fillStyle = C.shoe; ctx.beginPath(); ctx.moveTo(-2.4, -1.6); ctx.lineTo(5.6, -1.2); ctx.quadraticCurveTo(7.4, 0.6, 5.4, 1.6); ctx.lineTo(-2.6, 1.6); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  const arm = (a, col, front) => {
    const sh = [0.5, -55.5];
    const el = [sh[0] + Math.sin(a) * 12.5, sh[1] + Math.cos(a) * 12.5];
    const b = a + (air ? 0.15 : front ? 0.35 : 0.25);
    const wr = [el[0] + Math.sin(b) * 11, el[1] + Math.cos(b) * 11];

    ctx.fillStyle = C.skin; ctx.strokeStyle = C.line; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(wr[0] + Math.sin(b) * 1.8, wr[1] + Math.cos(b) * 1.8, 1.8, 2.4, -b, 0, 7); ctx.fill(); ctx.stroke();
  };

  let kL = moving ? Math.max(0, -sw) * 0.55 : 0, kR = moving ? Math.max(0, sw) * 0.55 : 0;

  leg(aR, kR, C.pantsSh);
  // torso: jacket over shirt
  ctx.beginPath();
  ctx.moveTo(-4.6, -57.5); ctx.quadraticCurveTo(0, -59.5, 4.4, -57.6);
  ctx.lineTo(4.6, -50); ctx.quadraticCurveTo(4.2, -42, 4.6, -34);
  ctx.lineTo(-4.4, -34); ctx.quadraticCurveTo(-5.4, -44, -5.4, -50); ctx.closePath();
  ctx.fillStyle = C.suit; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 0.9; ctx.stroke();

  ctx.fillStyle = C.shirt; ctx.beginPath(); ctx.moveTo(1.4, -58); ctx.lineTo(4.4, -57.6); ctx.lineTo(4.1, -49); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.tie; ctx.beginPath(); ctx.moveTo(3.2, -57.6); ctx.lineTo(4.3, -57.4); ctx.lineTo(4.6, -47); ctx.lineTo(3.6, -45.6); ctx.lineTo(3, -47.2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.suitSh; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(1.2, -57.8); ctx.lineTo(3.6, -46); ctx.stroke();
  // front leg (drawn after torso hem so the jacket overlaps the hip only slightly)
  leg(aL, kL, C.pants);

  ctx.quadraticCurveTo(0, -6.8, 3.4, -4.6);      // crown
  ctx.quadraticCurveTo(4.6, -3, 4.4, -1.2);      // forehead
  ctx.lineTo(5.6, 0.9);                          // nose bridge -> tip
  ctx.lineTo(4.5, 1.5);                          // under nose
  ctx.quadraticCurveTo(4.8, 2.6, 4.2, 3.1);      // lips
  ctx.quadraticCurveTo(4.3, 4.8, 2.8, 5.1);      // chin
  ctx.quadraticCurveTo(0.4, 5, -0.6, 3.6);       // jaw
  ctx.lineTo(-3.6, 3.4);
  ctx.closePath();
  ctx.fillStyle = C.skin; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 0.8; ctx.stroke();
  // hair
  ctx.fillStyle = C.hair; ctx.beginPath();
  ctx.moveTo(-3.8, 1.2); ctx.quadraticCurveTo(-5.6, -2, -3.4, -4.9); ctx.quadraticCurveTo(0, -7.2, 3.6, -4.7); ctx.quadraticCurveTo(2, -4.2, 0.6, -3.3); ctx.quadraticCurveTo(-1.6, -2.4, -1.8, 0.4); ctx.closePath(); ctx.fill();
  // ear, eye, brow, mouth
  ctx.fillStyle = C.skinSh; ctx.beginPath(); ctx.ellipse(-1, 0.4, 1, 1.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1e1614'; ctx.beginPath(); ctx.arc(2.9, -1, 0.55, 0, 7); ctx.fill();
  ctx.strokeStyle = C.hair; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(2, -2.3); ctx.lineTo(4, -2.2); ctx.stroke();
  ctx.strokeStyle = '#7a4a40'; ctx.lineWidth = 0.6; ctx.beginPath();
  if (n >= 21) { ctx.moveTo(3.3, 3); ctx.quadraticCurveTo(4, 3.5, 4.4, 2.7); } else { ctx.moveTo(3.4, 3); ctx.lineTo(4.4, 3); }
  ctx.stroke();
  ctx.restore();
  // front arm
  arm(arF, C.suit, true);
  ctx.restore();
}

// ---------- the mannequin (Hazop) ----------
// n = number of memories recovered (0..21). The figure becomes more defined.
function drawHazop(ctx, P, n, t, opt) {
  opt = opt || {};
  if (n >= 16) return drawHuman(ctx, P, n, opt);
  const ang = opt.angle || 0, face = P.facing || 1;
  const moving = opt.moving, air = opt.air;
  const ph = P.walkPhase || 0;
  ctx.save();
  ctx.translate(P.x, P.y); ctx.rotate(ang); ctx.scale(face * (opt.scale || 1), opt.scale || 1);
  const sw = moving ? Math.sin(ph) : 0;
  const base = '#9b978f';
  const outline = n >= 1 ? '#2a2120' : null;
  const skin = '#e0b48e';
  const legCol = n >= 19 ? '#3c4658' : n >= 3 ? '#b8322a' : base;
  const torsoCol = n >= 20 ? '#5b4636' : base;
  const armCol = n >= 20 ? '#5b4636' : n >= 7 ? '#d9822b' : base;
  const headCol = n >= 18 ? skin : n >= 1 ? '#c9c4b6' : base;
  const lw = 1.6;
  const stroke = () => { if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = lw; ctx.stroke(); } };

  // limb helper: from (x0,y0) with angle a, length l, thickness w0->w1
  function limb(x0, y0, a, l, w0, w1, col) {
    const x1 = x0 + Math.sin(a) * l, y1 = y0 + Math.cos(a) * l;
    const nx = Math.cos(a), ny = -Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(x0 + nx * w0, y0 + ny * w0); ctx.lineTo(x1 + nx * w1, y1 + ny * w1);
    ctx.arc(x1, y1, w1, Math.atan2(ny, nx), Math.atan2(ny, nx) + Math.PI);
    ctx.lineTo(x0 - nx * w0, y0 - ny * w0); ctx.arc(x0, y0, w0, Math.atan2(-ny, -nx), Math.atan2(-ny, -nx) + Math.PI);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill(); stroke();
    return [x1, y1];
  }
  const hipY = -34;
  let aL = moving ? sw * 0.45 : 0.07, aR = moving ? -sw * 0.45 : -0.07, kL = Math.max(0, -sw) * 0.5, kR = Math.max(0, sw) * 0.5;
  if (air) { aL = 0.6; aR = -0.25; kL = 0.9; kR = 0.35; }
  // back leg
  let [kx, ky] = limb(-2, hipY, aR, 17, 5, 4, shade(legCol, -0.15));
  let [fx, fy] = limb(kx, ky, aR - kR, 17, 4, 3.3, shade(legCol, -0.15));
  if (n >= 6) { ctx.fillStyle = '#3a2a22'; ctx.beginPath(); ctx.ellipse(fx + 3, fy, 6, 3, 0, 0, 7); ctx.fill(); }
  // back arm
  const shY = -58;
  let arm1 = sw * -0.65, arm2 = sw * 0.65;
  if (air) { arm1 = 2.75; arm2 = 2.95; }
  const elb = air ? 0.15 : 0.45;
  let [ex, ey] = limb(-1, shY, arm2, 13, 3.6, 3, shade(armCol, -0.15));
  let [hx, hy] = limb(ex, ey, arm2 + elb, 12, 3, 2.6, shade(armCol, -0.15));
  if (n >= 15) { ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, 7); ctx.fill(); }
  // torso
  ctx.beginPath(); ctx.moveTo(-8, hipY + 2); ctx.lineTo(-11, shY - 2); ctx.quadraticCurveTo(0, shY - 7, 11, shY - 2); ctx.lineTo(8, hipY + 2); ctx.quadraticCurveTo(0, hipY + 6, -8, hipY + 2); ctx.closePath();
  ctx.fillStyle = torsoCol; ctx.fill();
  ctx.save(); ctx.clip();
  if (n >= 4 && n < 20) { ctx.fillStyle = '#76AE81'; ctx.beginPath(); ctx.moveTo(-12, shY); ctx.lineTo(4, shY); ctx.lineTo(-2, -44); ctx.lineTo(-12, -40); ctx.fill(); }
  if (n >= 5 && n < 20) { ctx.fillStyle = '#e8c44a'; ctx.beginPath(); ctx.moveTo(2, -50); ctx.lineTo(12, -54); ctx.lineTo(10, -36); ctx.lineTo(-2, -36); ctx.fill(); }
  if (n >= 10) { ctx.fillStyle = '#f2efe6'; ctx.beginPath(); ctx.moveTo(-5, shY - 4); ctx.lineTo(0, shY + 6); ctx.lineTo(5, shY - 4); ctx.fill(); }
  if (n >= 20) { ctx.fillStyle = '#f2efe6'; ctx.fillRect(-3, shY - 4, 6, 26); }
  if (n >= 9) { ctx.fillStyle = '#b8222a'; ctx.beginPath(); ctx.moveTo(-1.5, shY - 2); ctx.lineTo(1.5, shY - 2); ctx.lineTo(3, -42); ctx.lineTo(0, -38); ctx.lineTo(-3, -42); ctx.closePath(); ctx.fill(); }
  if (n >= 2) { ctx.strokeStyle = 'rgba(40,30,28,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-9, -46); ctx.quadraticCurveTo(0, -42, 9, -47); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-8, hipY + 2); ctx.lineTo(-11, shY - 2); ctx.quadraticCurveTo(0, shY - 7, 11, shY - 2); ctx.lineTo(8, hipY + 2); ctx.quadraticCurveTo(0, hipY + 6, -8, hipY + 2); ctx.closePath(); stroke();
  // front leg
  [kx, ky] = limb(2, hipY, aL, 17, 5, 4, legCol);
  [fx, fy] = limb(kx, ky, aL - kL, 17, 4, 3.3, legCol);
  if (n >= 6) { ctx.fillStyle = '#2b1f19'; ctx.beginPath(); ctx.ellipse(fx + 3, fy, 6, 3, 0, 0, 7); ctx.fill(); }
  // neck + head
  ctx.fillStyle = n >= 8 ? skin : headCol; ctx.fillRect(-2.5, shY - 9, 5, 6);
  ctx.save(); ctx.translate(1, shY - 17); ctx.rotate(0.12);
  ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 10, 0, 0, 7); ctx.fillStyle = headCol; ctx.fill(); stroke();
  if (n >= 2 && n < 18) { ctx.strokeStyle = 'rgba(40,30,28,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-7, -2); ctx.quadraticCurveTo(0, 3, 7, -3); ctx.moveTo(1, -10); ctx.quadraticCurveTo(-3, 0, 2, 10); ctx.stroke(); }
  if (n >= 11) { ctx.fillStyle = '#3a2a20'; ctx.beginPath(); ctx.ellipse(-1, -6, 8, 5, -0.2, Math.PI, 0); ctx.fill(); ctx.fillRect(-8.5, -6, 4, 6); }
  if (n >= 12) { ctx.fillStyle = shade(headCol, -0.12); ctx.beginPath(); ctx.ellipse(-3, 1, 2, 3, 0, 0, 7); ctx.fill(); }
  if (n >= 13) { ctx.fillStyle = '#1e1614'; ctx.beginPath(); ctx.arc(4, -1, 1.2, 0, 7); ctx.fill(); }
  if (n >= 14) { ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(2, -4); ctx.lineTo(6, -4.5); ctx.stroke(); }
  if (n >= 16) { ctx.strokeStyle = shade(headCol, -0.3); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(6.2, -1); ctx.lineTo(7.4, 2.4); ctx.lineTo(5.8, 2.9); ctx.stroke(); }
  if (n >= 17) { ctx.strokeStyle = '#7a3a30'; ctx.lineWidth = 1.2; ctx.beginPath(); if (n >= 21) ctx.arc(4.5, 4.5, 2.4, 0.2, Math.PI - 0.6); else { ctx.moveTo(3, 6); ctx.lineTo(6.5, 5.8); } ctx.stroke(); }
  ctx.restore();
  // front arm
  [ex, ey] = limb(1, shY, arm1, 13, 3.6, 3, armCol);
  [hx, hy] = limb(ex, ey, arm1 + elb, 12, 3, 2.6, armCol);
  if (n >= 15) { ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, 7); ctx.fill(); }
  ctx.restore();
}


// ---- audio.js ----
// ============================================================
// STAIRWAYS — procedural audio (WebAudio, no files)
// "The game must be very silent, like a deserted square."
// ============================================================

const Audio = (() => {
  let ctx = null, master, sfxBus, musBus, verb, noiseBuf;
  let musicOn = false, musicTimer = null, ambient = null, machine = null;
  const vol = { music: 0.6, sfx: 0.8 };

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = vol.music; musBus.connect(master);
    // simple feedback-delay "reverb" for the empty piazza
    verb = ctx.createDelay(1.0); verb.delayTime.value = 0.23;
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    verb.connect(lp); lp.connect(fb); fb.connect(verb);
    const wet = ctx.createGain(); wet.gain.value = 0.35; lp.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startAmbient();
  }

  function setVolumes(m, s) {
    vol.music = m; vol.sfx = s;
    if (!ctx) return;
    musBus.gain.setTargetAtTime(m, ctx.currentTime, 0.1);
    sfxBus.gain.setTargetAtTime(s, ctx.currentTime, 0.1);
  }

  function noise(dur, freq, q, gain, type, when, sendVerb) {
    if (!ctx) return;
    const t = (when || ctx.currentTime);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus); if (sendVerb) g.connect(verb);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);
    return f;
  }
  function tone(freq, dur, gain, type, when, bus, attack) {
    if (!ctx) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + (attack || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || sfxBus); g.connect(verb);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }

  const sfx = {

        const sp = Math.hypot(p.mdx || 0, p.mdy || 0), dir = Math.sign((p.mdx || 0) + (p.mdy || 0));

        p._moving = moving; if (moving) p._dir = dir;

    for (const p of G.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy = p.vy * 0.96 + (p.glow ? -10 : 30) * dt; }

      const target = Math.atan2(P.ux, -P.uy);

  function updateCamera(dt) {

  function handleEvents() {
    const w = G.world, P = w.player;

        case 'step': Audio.sfx.step(e.surface); break;
        case 'jump': Audio.sfx.jump(); break;
        case 'land': Audio.sfx.land(e.hard); puff(P.x, P.y, e.hard ? 10 : 5, 'rgba(70,55,45,.5)', 120, 40); break;
        case 'attach': Audio.sfx.attach(); puff(P.x, P.y, 5, 'rgba(70,55,45,.45)', 90, 30); break;
        case 'lever': Audio.sfx.lever(); puff(e.x, e.y - 20, 8, 'rgba(255,250,220,.9)', 140, 90); break;
        case 'wrap': Audio.sfx.wrap(); puff(e.x, e.y, 5, 'rgba(255,250,220,.7)', 90, 20); break;
        case 'lock': Audio.sfx.lock(); break;
        case 'tick': Audio.sfx.tick(); break;
        case 'timeup': Audio.sfx.timeup(); puff(e.x, e.y - 20, 6, 'rgba(255,250,220,.7)', 100, 60); break;
        case 'plate': Audio.sfx.plate(e.down); break;
        case 'push': Audio.sfx.push(); break;
        case 'crateland': Audio.sfx.land(true); puff(e.x, e.y, 6, 'rgba(70,55,45,.5)', 120, 30); break;
        case 'crateback': break;
        case 'crumble': Audio.sfx.crack(); puff(e.x, e.y, 6, 'rgba(90,76,68,.6)', 160, 20); break;
        case 'crumbled': Audio.sfx.rubble(); puff(e.x, e.y + 10, 16, 'rgba(90,76,68,.7)', 260, 10); break;

  // ---------------- menus ----------------
  function openPause() {

  function menuDef() {

        else it.push({ label: t.start, act: () => { Audio.sfx.ui(); fadeTo(1, () => startNewGame(), 2.5); G.state = 'transition'; } });

          { label: t.sfx, value: pct(cfg.sfx), adj: d => { cfg.sfx = Math.max(0, Math.min(1, Math.round((cfg.sfx + d * 0.1) * 10) / 10)); Audio.sfx.step('stone'); } },
          { label: t.fullscreen, value: document.fullscreenElement ? t.on : t.off, adj: () => toggleFullscreen() },
          { label: t.back, act: () => { saveCfg(); G.state = G.prevState || 'menu'; G.menuSel = 0; } },

  function onMenuKey(code) {
    if (G.state === 'title') { goMenu(); return; }
    if (G.state === 'intro' || G.state === 'thought') { if (['Space', 'Enter', 'ArrowUp', 'KeyW', 'KeyZ'].includes(code)) advanceThought(); return; }
    if (G.state === 'chapter') { if (G.chapterCard && G.chapterCard.t > 0.6) G.chapterCard.t = 99; return; }
    if (G.state === 'credits') { G.state = G.prevState || 'menu'; return; }
    if (G.state === 'goodbye') { G.state = 'title'; return; }
    if (G.state === 'ending') { if (G.ending.t > 8) finishEnding(); return; }
    const items = menuDef(); if (!items.length) return;
    if (code === 'ArrowDown' || code === 'KeyS') { G.menuSel = (G.menuSel + 1) % items.length; Audio.sfx.ui(); }
    else if (code === 'ArrowUp' || code === 'KeyW') { G.menuSel = (G.menuSel - 1 + items.length) % items.length; Audio.sfx.ui(); }
    else if ((code === 'ArrowLeft' || code === 'KeyA') && items[G.menuSel].adj) { items[G.menuSel].adj(-1); saveCfg(); Audio.sfx.ui(); }
    else if ((code === 'ArrowRight' || code === 'KeyD') && items[G.menuSel].adj) { items[G.menuSel].adj(1); saveCfg(); Audio.sfx.ui(); }
    else if (code === 'Enter' || code === 'Space') { const it = items[G.menuSel]; if (it.act) it.act(); else if (it.adj) { it.adj(1); saveCfg(); } Audio.sfx.ui(); }
    else if (code === 'Escape') {

      else if (G.state === 'confirm') { G.state = 'menu'; }

  }
  function finishEnding() { G.ending = null; G.world = null; G.state = 'menu'; G.menuSel = 0; fadeTo(0, null, 1); }
  function goMenu() { G.prevState = null; G.state = 'menu'; G.menuSel = 0; Audio.music(true); Audio.sfx.ui(); }

  let menuRects = [];
  function onMenuPointer(x, y, kind) {
    if (kind === 'down') {
      if (G.state === 'title') { goMenu(); return; }
      if (G.state === 'intro' || G.state === 'thought') { advanceThought(); return; }
      if (G.state === 'chapter') { if (G.chapterCard && G.chapterCard.t > 0.6) G.chapterCard.t = 99; return; }
      if (G.state === 'credits') { G.state = G.prevState || 'menu'; return; }
      if (G.state === 'goodbye') { G.state = 'title'; return; }
      if (G.state === 'ending') { if (G.ending.t > 8) finishEnding(); return; }
    }
    for (let i = 0; i < menuRects.length; i++) {
      const r = menuRects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        if (kind === 'hover') { if (G.menuSel !== i) G.menuSel = i; return; }
        if (kind === 'down') {

          const it = menuDef()[i];

    } else {
      ctx.drawImage(bg.back, -cam * 0.15, 0);
      ctx.drawImage(bg.mid, -cam * 0.45, 0);
    }
    // dreamy wash so the black vector foreground pops (as in the GDD boards)
    ctx.fillStyle = 'rgba(250,247,226,.30)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    // strong directional light from top-left
    const lg = ctx.createLinearGradient(0, 0, VIEW_W, VIEW_H);
    lg.addColorStop(0, 'rgba(255,250,215,.20)'); lg.addColorStop(0.6, 'rgba(255,250,215,0)'); lg.addColorStop(1, 'rgba(40,25,20,.12)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.save(); ctx.translate(-Math.round(cam), 0);
    if (room.exit) drawExitArrow(ctx, room.exit, room, w.exitOpen, G.t);
    for (const st of w.stairs) if (st.link) { const L = w.stairs.find(q => q.id === st.link); drawGearLink(ctx, st, L); L.gear = true; }
    for (const st of w.stairs) drawStair(ctx, st, G.t);
    for (const p of w.platforms) drawPlatform(ctx, p, G.t);
    for (const pl of w.plates || []) { const p = w.platforms.find(q => q.id === pl.plat); drawPlate(ctx, p.x + pl.dx, p.y, pl.w, pl.anim); }
    for (const L of w.levers) { const p = w.platforms.find(q => q.id === L.plat); drawLever(ctx, p.x + L.dx, p.y, L.anim, L); }
    if (w.mem && !w.memoryTaken) drawMemory(ctx, w.mem.x, w.mem.y, room.memory.id, G.t);
    // particles (dust)
    for (const p of G.particles) {
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = k; ctx.fillStyle = p.col;
      if (p.glow) ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.glow ? 1 : 1 + (1 - k)), 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
    // player
    const P = w.player;
    if (G.flash > 0) {
      const r = 40 + (1 - G.flash) * 160;
      const g = ctx.createRadialGradient(P.x, P.y - 36, 5, P.x, P.y - 36, r);
      g.addColorStop(0, `rgba(255,250,220,${G.flash})`); g.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(P.x, P.y - 36, r, 0, 7); ctx.fill();
    }
    // ground shadow
    if (P.state === 'ground') { ctx.fillStyle = 'rgba(30,20,18,.25)'; ctx.beginPath(); ctx.ellipse(P.x + 6, P.y + 2, 18, 4, 0, 0, 7); ctx.fill(); }
    drawHazop(ctx, P, memCount(), G.t, { angle: G.renderAng, moving: P.walkPhase > 0, air: P.state === 'air' });
    ctx.restore();
    vignette(0.42);
  }

  function drawHUD() {
    if (G.roomLabel > 0) {
      G.roomLabel -= 1 / 60;
      ctx.save(); ctx.globalAlpha = Math.min(1, G.roomLabel); ctx.font = `22px ${FONT_TYPE}`; ctx.fillStyle = '#1b1515';
      ctx.fillText(`${G.roomIdx + 1} / ${ROOMS.length}  ·  ${ROOMS[G.roomIdx].id}`, 40, 60); ctx.restore();
    }
    // pause icon (top-right), as in the GDD
    ctx.save();
    ctx.fillStyle = 'rgba(27,21,21,.85)';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.roundRect(VIEW_W - 78, 38 + i * 14, 40, 7, 3); ctx.fill(); }
    ctx.restore();
    // control hints (first room, or always if enabled on the very first seconds)
    const room = G.world.room;
    const showHints = cfg.hints && room.tutorial && memCount() === 0;
    const target = showHints && (!G.hasMoved || G.hintTimer < 9) ? 1 : 0;
    G.hintAlpha += (target - G.hintAlpha) * 0.05;
    if (G.hintAlpha > 0.01) drawHints(G.hintAlpha);
  }
  function arrow(x1, y1, x2, y2, w) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1);
    ctx.save(); ctx.translate(x1, y1); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, -w / 2); ctx.lineTo(L - w * 1.4, -w / 2); ctx.lineTo(L - w * 1.4, -w * 1.3); ctx.lineTo(L, 0); ctx.lineTo(L - w * 1.4, w * 1.3); ctx.lineTo(L - w * 1.4, w / 2); ctx.lineTo(0, w / 2); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill(); ctx.strokeStyle = '#1b1515'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  }
  function drawHints(a) {
    ctx.save(); ctx.globalAlpha = a;
    if (isTouch) {
      // touch hints removed: the mobile control scheme is still to be designed
    } else {
      ctx.font = `24px ${FONT_TYPE}`; ctx.textAlign = 'center';
      const txt = T().keysHint, w = ctx.measureText(txt).width + 60;
      ctx.fillStyle = 'rgba(245,240,225,.85)'; ctx.fillRect(VIEW_W / 2 - w / 2, 840, w, 44);
      ctx.fillStyle = '#1b1515'; ctx.fillText(txt, VIEW_W / 2, 870);
    }
    ctx.restore();
  }
  function drawRotateHint() {
    dim(0.9);
    ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = '#fbf8ea'; ctx.font = `60px ${FONT_TYPE}`; ctx.fillText('⟳', VIEW_W / 2, 420);
    ctx.font = `italic 40px ${FONT_THINK}`; ctx.fillText('↔', VIEW_W / 2, 500); ctx.restore();
  }

  // ---------------- loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  Audio.setVolumes(cfg.music, cfg.sfx);
  fadeTo(0, null, 0.8);
  requestAnimationFrame(frame);

  // debug / test API
  window.__stairways = { G, loadRoom, startNewGame, continueGame, ROOMS, setState: s => { G.state = s; } };
})();

</script>
</body>
