<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quattro Corde</title>
<style>
:root{--bg:#eef1f4;--ink:#1b222c;--mut:#5d6877;--line:#b9c1cc;--card:#fff;--note:#c27a12;--ok:#12856b;--bad:#cf3b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--ink:#e8edf3;--mut:#93a0b0;--line:#2e3846;--card:#171e27;--note:#e8a736;--ok:#3ccfa8;--bad:#ff6670}}
:root[data-theme="dark"]{--bg:#0f141a;--ink:#e8edf3;--mut:#93a0b0;--line:#2e3846;--card:#171e27;--note:#e8a736;--ok:#3ccfa8;--bad:#ff6670}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 2px}
p.sub{margin:0 0 16px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--note);outline-offset:2px}
canvas{display:block;width:100%;height:260px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 22px;margin:14px 0}
label{display:block;font-size:14px;color:var(--mut)}
label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%}
#live{font-variant-numeric:tabular-nums;min-height:1.5em}
#res{display:none;margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#res strong{font-size:34px;letter-spacing:-.02em}
.wide{overflow-x:auto}
</style></head><body><main>
<h1>Quattro Corde</h1>
<p class="sub">Suona il basso seguendo la tab. L’app ti ascolta e segna ogni nota: giusta e a tempo, oppure ×.</p>
<div class="bar">
<select id="song" aria-label="Brano"></select>
<button id="mic">Attiva microfono</button>
<button id="play" class="main">Play</button>
<button id="rst">Dall’inizio</button>
<span id="live" aria-live="polite">Microfono spento</span>
</div>
<div class="wide"><canvas id="cv" aria-label="Tab per basso a quattro corde"></canvas></div>
<div class="grid">
<label>Posizione <b id="vp"></b><input id="pos" type="range" min="-2" max="20" step="0.05" value="-2"></label>
<label>Velocità <b id="vs">100%</b><input id="spd" type="range" min="0.4" max="1.25" step="0.05" value="1"></label>
<label>Ritardo del microfono <b id="vl">120 ms</b><input id="lat" type="range" min="0" max="400" step="10" value="120"></label>
<label><input id="oct" type="checkbox" checked> Accetta la nota anche un’ottava sopra o sotto</label>
</div>
<div id="res" aria-live="polite"></div>
</main>
<script>
const OPEN=[43,38,33,28],LBL=["G","D","A","E"],NM=["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
const SONGS={
ode:{n:"Inno alla gioia (pubblico dominio)",bpm:84,a:[[40,1],[40,1],[41,1],[43,1],[43,1],[41,1],[40,1],[38,1],[36,1],[36,1],[38,1],[40,1],[40,1.5],[38,.5],[38,2]]},
fra:{n:"Fra Martino (tradizionale)",bpm:96,a:[[36,1],[38,1],[40,1],[36,1],[36,1],[38,1],[40,1],[36,1],[40,1],[41,1],[43,2],[40,1],[41,1],[43,2],[43,.5],[45,.5],[43,.5],[41,.5],[40,1],[36,1],[43,.5],[45,.5],[43,.5],[41,.5],[40,1],[36,1],[36,1],[31,1],[36,2],[36,1],[31,1],[36,2]]},
scala:{n:"Scala di Do, esercizio",bpm:72,a:[[36,1],[38,1],[40,1],[41,1],[43,1],[45,1],[47,1],[48,2],[47,1],[45,1],[43,1],[41,1],[40,1],[38,1],[36,2]]}
};
const $=id=>document.getElementById(id),cv=$("cv"),cx=cv.getContext("2d");
let notes=[],bpm=80,end=0,pos=-2,playing=false,last=0,ana=null,buf=null,sr=48000,cur=0,prev=0,tol=.3;
const sel=$("song");for(const k in SONGS){const o=document.createElement("option");o.value=k;o.textContent=SONGS[k].n;sel.append(o)}
function load(k){const S=SONGS[k];let t=0;bpm=S.bpm;notes=S.a.map(([m,d])=>{let s=0;for(let i=0;i<4;i++)if(OPEN[i]<=m){s=i;break}const n={m,s,f:m-OPEN[s],t,d,st:0};t+=d;return n});end=t;$("pos").max=end;playing=false;$("play").textContent="Play";$("res").style.display="none";pos=-2;$("pos").value=pos}
sel.onchange=()=>load(sel.value);load("ode");
$("play").onclick=()=>{if(pos>=end)seek(-2);playing=!playing;$("play").textContent=playing?"Pausa":"Play";$("res").style.display="none"};
$("rst").onclick=()=>{seek(-2)};
function seek(p){pos=p;for(const n of notes)if(n.t>=p-.5)n.st=0;$("pos").value=p}
$("pos").oninput=e=>{seek(+e.target.value);$("res").style.display="none"};
$("spd").oninput=e=>$("vs").textContent=Math.round(e.target.value*100)+"%";
$("lat").oninput=e=>$("vl").textContent=e.target.value+" ms";
$("mic").onclick=async()=>{
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 const ac=new (window.AudioContext||window.webkitAudioContext)();sr=ac.sampleRate;const src=ac.createMediaStreamSource(st);ana=ac.createAnalyser();ana.fftSize=4096;buf=new Float32Array(4096);src.connect(ana);
 $("mic").textContent="Microfono attivo";$("mic").disabled=true;$("live").textContent="Suona una corda a vuoto per provare";setInterval(listen,40)}
 catch(e){$("live").textContent="Microfono non disponibile: controlla i permessi del browser o apri la pagina in una scheda a sé."}};
function yin(b){const W=2048,M=Math.min(1500,b.length-W);let r=0;for(let i=0;i<W;i++)r+=b[i]*b[i];if(r/W<2e-5)return 0;
 const d=new Float32Array(M);for(let t=1;t<M;t++){let s=0;for(let j=0;j<W;j++){const x=b[j]-b[j+t];s+=x*x}d[t]=s}
 let run=0;d[0]=1;for(let t=1;t<M;t++){run+=d[t];d[t]=d[t]*t/run}
 for(let t=Math.floor(sr/400);t<M-1;t++)if(d[t]<.15){while(t+1<M-1&&d[t+1]<d[t])t++;const a=d[t-1],c=d[t+1],q=a-2*d[t]+c;return sr/(t+(q?(a-c)/(2*q):0))}return 0}
function listen(){ana.getFloatTimeDomainData(buf);const f=yin(buf);if(!f){cur=0;prev=0;return}
 const m=Math.round(69+12*Math.log2(f/440));if(m<24||m>62){cur=0;return}
 $("live").textContent="Senti: "+NM[m%12]+" ("+f.toFixed(0)+" Hz)";
 const stable=m===prev;prev=m;cur=m;if(!stable||!playing)return;
 const p=pos-($("lat").value/1000)*bpm*+$("spd").value/60,tb=tol*bpm*+$("spd").value/60;
 for(const n of notes)if(n.st===0&&Math.abs(p-n.t)<=tb&&(m===n.m||($("oct").checked&&(m-n.m)%12===0)))n.st=1}
function finish(){playing=false;$("play").textContent="Play";const ok=notes.filter(n=>n.st===1).length,pc=Math.round(ok/notes.length*100);
 const R=$("res");R.style.display="block";R.innerHTML="<strong>"+pc+"%</strong> · "+ok+" note su "+notes.length+(ana?"":"<br>Il microfono era spento: attivalo per ricevere il punteggio vero.")}
function frame(ts){const dt=Math.min(.1,(ts-last)/1000||0);last=ts;const sp=+$("spd").value;
 if(playing){pos+=dt*bpm*sp/60;const tb=tol*bpm*sp/60;const lb=($("lat").value/1000)*bpm*sp/60;
  for(const n of notes)if(n.st===0&&pos-lb>n.t+tb)n.st=ana?2:3;
  $("pos").value=pos;if(pos>end+.5)finish()}
 $("vp").textContent=Math.max(0,Math.floor(pos))+" / "+Math.round(end)+" battiti";draw();requestAnimationFrame(frame)}
function draw(){const dpr=devicePixelRatio||1,w=cv.clientWidth,h=260;if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);const cs=getComputedStyle(document.documentElement),g=v=>cs.getPropertyValue(v).trim();
 const nx=w*.2,ppb=Math.max(70,Math.min(110,w/9)),ys=[44,100,156,212];
 cx.font="600 15px system-ui,sans-serif";cx.textBaseline="middle";cx.textAlign="center";
 for(let b=Math.ceil(pos-nx/ppb);b<pos+(w-nx)/ppb;b++){const x=nx+(b-pos)*ppb;cx.strokeStyle=g("--line");cx.globalAlpha=.35;cx.beginPath();cx.moveTo(x,24);cx.lineTo(x,232);cx.stroke()}cx.globalAlpha=1;
 ys.forEach((y,i)=>{cx.strokeStyle=g("--line");cx.lineWidth=1+i*.6;cx.beginPath();cx.moveTo(34,y);cx.lineTo(w,y);cx.stroke();cx.fillStyle=g("--mut");cx.fillText(LBL[i],16,y)});cx.lineWidth=1;
 for(const n of notes){const x=nx+(n.t-pos)*ppb,wd=Math.max(30,n.d*ppb-6);if(x+wd<34||x>w)continue;const y=ys[n.s];
  const c=n.st===1?g("--ok"):n.st===2?g("--bad"):g("--note");cx.globalAlpha=n.st===3||(n.st===0&&x<nx-60)?.45:1;
  cx.fillStyle=c;cx.beginPath();cx.roundRect(Math.max(x,36),y-15,wd-(Math.max(x,36)-x),30,15);cx.fill();
  cx.fillStyle="#fff";cx.fillText(n.st===2?"×":String(n.f),Math.max(x,36)+15,y);cx.globalAlpha=1}
 cx.strokeStyle=g("--ink");cx.lineWidth=2;cx.beginPath();cx.moveTo(nx,16);cx.lineTo(nx,240);cx.stroke();cx.lineWidth=1;
 cx.fillStyle=g("--mut");cx.font="13px system-ui,sans-serif";cx.textAlign="left";
 if(pos<0&&playing)cx.fillText("Preparati…",nx+10,250);else if(!playing&&pos<=-1.9)cx.fillText("Premi Play e suona sulla linea",nx+10,250)}
requestAnimationFrame(frame);
</script></body></html>
